name: Dynamicallyrics
options:
  bundleIdPrefix: com.jonathantran
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LyricCore:
    path: Packages/LyricCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Dynamicallyrics:
    type: application
    platform: iOS
    sources:
      - path: DynamicallyricsApp
    dependencies:
      - package: LyricCore
      - target: LyricWidgets
        embed: true
        codeSign: true
        copy:
          destination: plugins
    info:
      path: DynamicallyricsApp/Support/Info.plist
      properties:
        CFBundleDisplayName: Dynamicallyrics
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "Dynamicallyrics reads the currently playing track to show synced lyrics."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: DynamicallyricsApp/Support/Dynamicallyrics.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jonathantran.dynamicallyrics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathantran.dynamicallyrics
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: false

  LyricWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LyricWidgets
    dependencies:
      - package: LyricCore
    info:
      path: LyricWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: LyricWidgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LyricWidgets/Support/LyricWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jonathantran.dynamicallyrics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathantran.dynamicallyrics.widgets
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Dynamicallyrics:
    build:
      targets:
        Dynamicallyrics: all
        LyricWidgets: all
    run:
      config: Debug
