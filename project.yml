name: Dynamicallyrics
options:
  bundleIdPrefix: com.jonathantran
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  LyricCore:
    path: Packages/LyricCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "16"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 643P4Q6FLQ

targets:
  Dynamicallyrics:
    type: application
    platform: iOS
    sources:
      - path: DynamicallyricsApp
    dependencies:
      - package: LyricCore
      - target: LyricWidgets
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: DynamicallyricsWatch
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Watch
    # (watch widget extension is embedded inside the watch app target below)
    info:
      path: DynamicallyricsApp/Support/Info.plist
      properties:
        CFBundleDisplayName: OpenLyrics
        CFBundleName: OpenLyrics
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Bungee-Regular.ttf
          - BebasNeue-Regular.ttf
          - Baloo2.ttf
          - Pacifico-Regular.ttf
          - PlayfairDisplay.ttf
          - SpaceGrotesk.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.jonathantran.dynamicallyrics
            CFBundleURLSchemes:
              - dynamicallyrics
        LSApplicationQueriesSchemes:
          - spotify
    entitlements:
      path: DynamicallyricsApp/Support/Dynamicallyrics.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jonathantran.dynamicallyrics.la
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathantran.dynamicallyrics.la
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: false
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: DynamicallyricsApp/Support/Dynamicallyrics.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: DynamicallyricsApp/Support/Dynamicallyrics.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "6EAAD94AEE0469F154208895545F3D6B9C3E0F0A"
          PROVISIONING_PROFILE_SPECIFIER: "Dynamicallyrics App Store Connect"

  LyricWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LyricWidgets
    dependencies:
      - package: LyricCore
    info:
      path: LyricWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: OpenLyrics Widgets
        CFBundleName: OpenLyrics Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Bungee-Regular.ttf
          - BebasNeue-Regular.ttf
          - Baloo2.ttf
          - Pacifico-Regular.ttf
          - PlayfairDisplay.ttf
          - SpaceGrotesk.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LyricWidgets/Support/LyricWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jonathantran.dynamicallyrics.la
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathantran.dynamicallyrics.la.widgets
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "6EAAD94AEE0469F154208895545F3D6B9C3E0F0A"
          PROVISIONING_PROFILE_SPECIFIER: "Dynamicallyrics Widgets App Store Connect"

  LyricWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
    dependencies:
      - package: LyricCore
    info:
      path: WatchWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: OpenLyrics Widgets
        CFBundleName: OpenLyrics Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/Support/LyricWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jonathantran.dynamicallyrics.la
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathantran.dynamicallyrics.la.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "6EAAD94AEE0469F154208895545F3D6B9C3E0F0A"
          PROVISIONING_PROFILE_SPECIFIER: "Dynamicallyrics Watch Widgets App Store Connect"

  DynamicallyricsWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    dependencies:
      - package: LyricCore
      - target: LyricWatchWidgets
        embed: true
        codeSign: true
        copy:
          destination: plugins
    info:
      path: WatchApp/Support/Info.plist
      properties:
        CFBundleDisplayName: OpenLyrics
        CFBundleName: OpenLyrics
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jonathantran.dynamicallyrics.la
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathantran.dynamicallyrics.la.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "6EAAD94AEE0469F154208895545F3D6B9C3E0F0A"
          PROVISIONING_PROFILE_SPECIFIER: "Dynamicallyrics Watch App Store Connect"

schemes:
  Dynamicallyrics:
    build:
      targets:
        Dynamicallyrics: all
        LyricWidgets: all
    run:
      config: Debug

  DynamicallyricsWatch:
    build:
      targets:
        DynamicallyricsWatch: all
        LyricWatchWidgets: all
    run:
      config: Debug
