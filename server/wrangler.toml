name = "openlyrics-sync"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Durable Object: one alarm-driven poller loop for the single-user session.
[durable_objects]
bindings = [
  { name = "SESSION", class_name = "PlaybackSessionV2" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlaybackSession"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "PlaybackSession", to = "PlaybackSessionV2" }]

# Secrets (set via `wrangler secret put`):
#   APNS_KEY_P8        raw contents of the Apple .p8 auth key
#   APNS_KEY_ID        e.g. 4G6T5TV7Y6
#   APNS_TEAM_ID       e.g. 643P4Q6FLQ  (also used as JWT `iss`)
#   SPOTIFY_CLIENT_ID  e.g. 6401f24daeea4c2aa4e333778dff01a2
#   SYNC_AUTH_TOKEN    long random token shared with the app
